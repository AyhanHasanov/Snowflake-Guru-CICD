name: Schema Change Deployment

on:
  push:
    branches:
      - prod
      - dev
      - uat
    paths:
      - 'migrations/**'
      - '.github/workflows/schemachange-deploy.yml'
  pull_request:
    branches:
      - prod
      - dev
      - uat
    paths:
      - 'migrations/**'
      - '.github/workflows/schemachange-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

jobs:
  determine-environment:
    runs-on: ubuntu-22.04
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      should-deploy: ${{ steps.set-env.outputs.should-deploy }}
    steps:
      - name: Set environment based on branch
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/uat" ]; then
            echo "environment=uat" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/prod" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi
      - name: Display environment
        run: |
          echo "Deploying to: ${{ steps.set-env.outputs.environment }}"
          echo "Should deploy: ${{ steps.set-env.outputs.should-deploy }}"

  validate-migrations:
    runs-on: ubuntu-22.04
    needs: determine-environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate migration files
        run: |
          echo "Validating migration file naming conventions..."
          python -c "
          import os
          import re
          import sys
          
          migrations_dir = 'migrations'
          pattern = r'^V\d+\.\d+\.\d+__.+\.sql$'
          
          if not os.path.exists(migrations_dir):
              print(f'ERROR: {migrations_dir} directory does not exist')
              sys.exit(1)
          
          files = [f for f in os.listdir(migrations_dir) if f.endswith('.sql')]
          if not files:
              print('WARNING: No migration files found')
              sys.exit(0)
          
          invalid_files = []
          for file in files:
              if not re.match(pattern, file):
                  invalid_files.append(file)
          
          if invalid_files:
              print('ERROR: Invalid migration file names:')
              for file in invalid_files:
                  print(f'  - {file}')
              print(f'Expected format: V<version>__<description>.sql (e.g., V1.0.0__initial_setup.sql)')
              sys.exit(1)
          
          print(f'All {len(files)} migration files have valid names')
          "

  deploy-to-snowflake:
    runs-on: ubuntu-22.04
    needs: [determine-environment, validate-migrations]
    if: needs.determine-environment.outputs.should-deploy == 'true'
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git diff to work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Deploy to Snowflake (DEV)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_DEV }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER_DEV }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD_DEV }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE_DEV }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE_DEV }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE_DEV }}
        if: needs.determine-environment.outputs.environment == 'dev'
        run: |
          echo "Deploying to dev environment..."
          schemachange \
            -f migrations \
            -a "$SNOWFLAKE_ACCOUNT" \
            -u "$SNOWFLAKE_USER" \
            -r "$SNOWFLAKE_ROLE" \
            -w "$SNOWFLAKE_WAREHOUSE" \
            -d "$SNOWFLAKE_DATABASE" \
            -c "$SNOWFLAKE_DATABASE.SCHEMACHANGE.CHANGE_HISTORY" \
            --create-change-history-table 
      
      - name: Deploy to Snowflake (UAT)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_UAT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER_UAT }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD_UAT }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE_UAT }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE_UAT }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE_UAT }}
        if: needs.determine-environment.outputs.environment == 'uat'
        run: |
          echo "Deploying to uat environment..."
          schemachange \
            -f migrations \
            -a "$SNOWFLAKE_ACCOUNT" \
            -u "$SNOWFLAKE_USER" \
            -r "$SNOWFLAKE_ROLE" \
            -w "$SNOWFLAKE_WAREHOUSE" \
            -d "$SNOWFLAKE_DATABASE" \
            -c "$SNOWFLAKE_DATABASE.SCHEMACHANGE.CHANGE_HISTORY" \
            --create-change-history-table 
      
      - name: Deploy to Snowflake (PROD)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_PROD }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER_PROD }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD_PROD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE_PROD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE_PROD }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE_PROD }}
        if: needs.determine-environment.outputs.environment == 'prod'
        run: |
          echo "Deploying to prod environment..."
          schemachange \
            -f migrations \
            -a "$SNOWFLAKE_ACCOUNT" \
            -u "$SNOWFLAKE_USER" \
            -r "$SNOWFLAKE_ROLE" \
            -w "$SNOWFLAKE_WAREHOUSE" \
            -d "$SNOWFLAKE_DATABASE" \
            -c "$SNOWFLAKE_DATABASE.SCHEMACHANGE.CHANGE_HISTORY" \
            --create-change-history-table 

      - name: Deployment Summary
        if: success()
        run: |
          echo "Successfully deployed migrations to ${{ needs.determine-environment.outputs.environment }} environment"
      
      - name: Check if XML files exist
        id: xmlcheck
        run: |
          # Check if XML files exist in the repository
          if [ -d "assets/xml" ] && [ "$(find assets/xml -name '*.xml' 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "XML files found in assets/xml directory:"
            find assets/xml -name '*.xml' | head -10
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No XML files found in assets/xml directory"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      

      - name: Install SnowSQL
        if: steps.xmlcheck.outputs.changed == 'true'
        run: |
          set -euo pipefail

          BOOTSTRAP="1.2"
          VERSION="1.2.27"
          URL="https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/$BOOTSTRAP/linux_x86_64/snowsql-$VERSION-linux_x86_64.bash"

          echo "Downloading SnowSQL from $URL"
          curl -fSL "$URL" -o snowsql-installer.bash || { echo "Failed to download SnowSQL installer"; exit 1; }
          chmod +x snowsql-installer.bash

          mkdir -p "$HOME/bin"
          bash snowsql-installer.bash -b -p "$HOME/bin" || { echo "SnowSQL installation failed"; exit 1; }

          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH="$HOME/bin:$PATH"

          if ! command -v snowsql &> /dev/null; then
            echo "ERROR: snowsql command not found after installation"
            echo "PATH: $PATH"
            ls -la "$HOME/bin" || true
            exit 1
          fi

          echo "SnowSQL installed successfully:"
          which snowsql
          snowsql --version || { echo "Failed to get SnowSQL version"; exit 1; }

      
      - name: Upload XML files to Snowflake stages (DEV)
        if: steps.xmlcheck.outputs.changed == 'true' && needs.determine-environment.outputs.environment == 'dev'
        env:
          SNOWSQL_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_DEV }}
          SNOWSQL_USER: ${{ secrets.SNOWFLAKE_USER_DEV }}
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD_DEV }}
          SNOWSQL_ROLE: ${{ secrets.SNOWFLAKE_ROLE_DEV }}
          SNOWSQL_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE_DEV }}
          SNOWSQL_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE_DEV }}
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:$PATH"
          
          if ! command -v snowsql &> /dev/null; then
            echo "ERROR: snowsql command not found"
            exit 1
          fi
          
          echo "SnowSQL upload diagnostics (DEV)"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "PWD: $(pwd)"
          echo "Account: ${SNOWSQL_ACCOUNT}"
          echo "User: ${SNOWSQL_USER}"
          echo "Role: ${SNOWSQL_ROLE}"
          echo "Warehouse: ${SNOWSQL_WAREHOUSE}"
          echo "Database: ${SNOWSQL_DATABASE}"
          echo "Files in assets/xml/anime_stack_exchange:"
          ls -la "$GITHUB_WORKSPACE/assets/xml/anime_stack_exchange" || true
          echo "Files in assets/xml/beer_stack_exchange:"
          ls -la "$GITHUB_WORKSPACE/assets/xml/beer_stack_exchange" || true
          
          echo "Uploading Anime StackExchange XML files..."
          if ! snowsql --config-path /dev/null -o log_level=DEBUG \
            -q "PUT file://$GITHUB_WORKSPACE/assets/xml/anime_stack_exchange/*.xml @ANIME_STACKEXCHANGE_SOURCE.RAW_STAGE AUTO_COMPRESS=FALSE;" \
            2>&1 | tee "$RUNNER_TEMP/snowsql-dev-anime.log"; then
            echo "ERROR: Failed to upload Anime StackExchange XML files"
            cat "$RUNNER_TEMP/snowsql-dev-anime.log" || true
            exit 1
          fi

          echo "Uploading Beer StackExchange XML files..."
          if ! snowsql --config-path /dev/null -o log_level=DEBUG \
            -q "PUT file://$GITHUB_WORKSPACE/assets/xml/beer_stack_exchange/*.xml @BEER_STACKEXCHANGE_SOURCE.RAW_STAGE AUTO_COMPRESS=FALSE;" \
            2>&1 | tee "$RUNNER_TEMP/snowsql-dev-beer.log"; then
            echo "ERROR: Failed to upload Beer StackExchange XML files"
            cat "$RUNNER_TEMP/snowsql-dev-beer.log" || true
            exit 1
          fi
          
          echo "SnowSQL logs (DEV):"
          ls -la "$RUNNER_TEMP/snowsql-dev-"*.log || true
          echo "Upload completed successfully"

      - name: Upload XML files to Snowflake stages (UAT)
        if: steps.xmlcheck.outputs.changed == 'true' && needs.determine-environment.outputs.environment == 'uat'
        env:
          SNOWSQL_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_UAT }}
          SNOWSQL_USER: ${{ secrets.SNOWFLAKE_USER_UAT }}
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD_UAT }}
          SNOWSQL_ROLE: ${{ secrets.SNOWFLAKE_ROLE_UAT }}
          SNOWSQL_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE_UAT }}
          SNOWSQL_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE_UAT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:$PATH"
          
          if ! command -v snowsql &> /dev/null; then
            echo "ERROR: snowsql command not found"
            exit 1
          fi
          
          echo "SnowSQL upload diagnostics (UAT)"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "PWD: $(pwd)"
          echo "Account: ${SNOWSQL_ACCOUNT}"
          echo "User: ${SNOWSQL_USER}"
          echo "Role: ${SNOWSQL_ROLE}"
          echo "Warehouse: ${SNOWSQL_WAREHOUSE}"
          echo "Database: ${SNOWSQL_DATABASE}"
          echo "Files in assets/xml/anime_stack_exchange:"
          ls -la "$GITHUB_WORKSPACE/assets/xml/anime_stack_exchange" || true
          echo "Files in assets/xml/beer_stack_exchange:"
          ls -la "$GITHUB_WORKSPACE/assets/xml/beer_stack_exchange" || true
          
          echo "Uploading Anime StackExchange XML files..."
          if ! snowsql --config-path /dev/null -o log_level=DEBUG \
            -q "PUT file://$GITHUB_WORKSPACE/assets/xml/anime_stack_exchange/*.xml @ANIME_STACKEXCHANGE_SOURCE.RAW_STAGE AUTO_COMPRESS=FALSE;" \
            2>&1 | tee "$RUNNER_TEMP/snowsql-uat-anime.log"; then
            echo "ERROR: Failed to upload Anime StackExchange XML files"
            cat "$RUNNER_TEMP/snowsql-uat-anime.log" || true
            exit 1
          fi

          echo "Uploading Beer StackExchange XML files..."
          if ! snowsql --config-path /dev/null -o log_level=DEBUG \
            -q "PUT file://$GITHUB_WORKSPACE/assets/xml/beer_stack_exchange/*.xml @BEER_STACKEXCHANGE_SOURCE.RAW_STAGE AUTO_COMPRESS=FALSE;" \
            2>&1 | tee "$RUNNER_TEMP/snowsql-uat-beer.log"; then
            echo "ERROR: Failed to upload Beer StackExchange XML files"
            cat "$RUNNER_TEMP/snowsql-uat-beer.log" || true
            exit 1
          fi
          
          echo "SnowSQL logs (UAT):"
          ls -la "$RUNNER_TEMP/snowsql-uat-"*.log || true
          echo "Upload completed successfully"

      - name: Upload XML files to Snowflake stages (PROD)
        if: steps.xmlcheck.outputs.changed == 'true' && needs.determine-environment.outputs.environment == 'prod'
        env:
          SNOWSQL_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_PROD }}
          SNOWSQL_USER: ${{ secrets.SNOWFLAKE_USER_PROD }}
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD_PROD }}
          SNOWSQL_ROLE: ${{ secrets.SNOWFLAKE_ROLE_PROD }}
          SNOWSQL_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE_PROD }}
          SNOWSQL_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE_PROD }}
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:$PATH"
          
          if ! command -v snowsql &> /dev/null; then
            echo "ERROR: snowsql command not found"
            exit 1
          fi
          
          echo "SnowSQL upload diagnostics (PROD)"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "PWD: $(pwd)"
          echo "Account: ${SNOWSQL_ACCOUNT}"
          echo "User: ${SNOWSQL_USER}"
          echo "Role: ${SNOWSQL_ROLE}"
          echo "Warehouse: ${SNOWSQL_WAREHOUSE}"
          echo "Database: ${SNOWSQL_DATABASE}"
          echo "Files in assets/xml/anime_stack_exchange:"
          ls -la "$GITHUB_WORKSPACE/assets/xml/anime_stack_exchange" || true
          echo "Files in assets/xml/beer_stack_exchange:"
          ls -la "$GITHUB_WORKSPACE/assets/xml/beer_stack_exchange" || true
          
          echo "Uploading Anime StackExchange XML files..."
          if ! snowsql --config-path /dev/null -o log_level=DEBUG \
            -q "PUT file://$GITHUB_WORKSPACE/assets/xml/anime_stack_exchange/*.xml @ANIME_STACKEXCHANGE_SOURCE.RAW_STAGE AUTO_COMPRESS=FALSE;" \
            2>&1 | tee "$RUNNER_TEMP/snowsql-prod-anime.log"; then
            echo "ERROR: Failed to upload Anime StackExchange XML files"
            cat "$RUNNER_TEMP/snowsql-prod-anime.log" || true
            exit 1
          fi

          echo "Uploading Beer StackExchange XML files..."
          if ! snowsql --config-path /dev/null -o log_level=DEBUG \
            -q "PUT file://$GITHUB_WORKSPACE/assets/xml/beer_stack_exchange/*.xml @BEER_STACKEXCHANGE_SOURCE.RAW_STAGE AUTO_COMPRESS=FALSE;" \
            2>&1 | tee "$RUNNER_TEMP/snowsql-prod-beer.log"; then
            echo "ERROR: Failed to upload Beer StackExchange XML files"
            cat "$RUNNER_TEMP/snowsql-prod-beer.log" || true
            exit 1
          fi
          
          echo "SnowSQL logs (PROD):"
          ls -la "$RUNNER_TEMP/snowsql-prod-"*.log || true
          echo "Upload completed successfully"
